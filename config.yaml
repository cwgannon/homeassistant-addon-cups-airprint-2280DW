name: CUPS
version: "1.2.0"
url: https://github.com/cwgannon/homeassistant-addon-cups-airprint-2280DW
slug: cupsik
description: A CUPS print server with working AirPrint for Brother HL2240
arch:
  - amd64
usb: true
init: false
homeassistant_api: true
host_network: true
ports:
  631/tcp: 631
  631/udp: 631
ports_description:
  631/tcp: For other devices on the local network to print to this server
  631/udp: For other devices on the local network to print to this server
# ingress: false
map:
  - addon_config:rw
options:
  paper_size: letter
schema:
  paper_size: list(letter|a4|legal)
